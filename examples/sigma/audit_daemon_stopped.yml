title: Linux Audit Daemon Stopped Or Auditing Disabled
id: a06a0899-9571-4320-a5d0-6387b4fd3b76
status: experimental
description: Detects commands that stop, disable or mask auditd, or switch kernel auditing off with auditctl, which removes a key source of forensic evidence.
author: SentinelAI project (example)
date: 2026/11/04
references: []
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_service:
    CommandLine|contains:
      - 'systemctl stop auditd'
      - 'systemctl disable auditd'
      - 'systemctl mask auditd'
      - 'service auditd stop'
  selection_auditctl:
    CommandLine|contains: 'auditctl -e 0'
  condition: 1 of selection_*
falsepositives:
  - Planned maintenance windows or audit rule migrations
level: high
