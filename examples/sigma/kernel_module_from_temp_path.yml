title: Kernel Module Loaded From A Temporary Path
id: 3fc10c9f-0048-4177-8fc6-7742c82d31d9
status: experimental
description: Detects insmod or modprobe pointing at a module file under /tmp, /var/tmp or /dev/shm. Legitimate modules come from the distribution package tree, so this suggests a rootkit or an unsigned driver.
author: SentinelAI project (example)
date: 2026/11/04
references: []
tags:
  - attack.persistence
  - attack.t1547.006
  - attack.defense_evasion
  - attack.t1014
logsource:
  product: linux
  category: process_creation
detection:
  selection_loader:
    CommandLine|contains:
      - 'insmod '
      - 'modprobe '
  selection_path:
    CommandLine|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
  condition: selection_loader and selection_path
falsepositives:
  - Driver developers testing a freshly built out-of-tree module
level: high
