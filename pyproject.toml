[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai"
version = "0.1.0"
description = "AI-assisted security log analysis, detection and automated response platform for Linux systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emre Eren", email = "3mr3ren@gmail.com" }]
keywords = [
    "security", "siem", "ids", "log-analysis", "threat-intelligence",
    "anomaly-detection", "blue-team", "soc", "detection-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ai = ["scikit-learn>=1.3", "numpy>=1.24"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
sentinel = "sentinelai.cli.app:main"

[project.urls]
Homepage = "https://github.com/E2xCoder/SentinelAI"
Documentation = "https://github.com/E2xCoder/SentinelAI#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinelai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Regex pattern tables are clearest as one pattern per line.
"src/sentinelai/parsers/classify.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
