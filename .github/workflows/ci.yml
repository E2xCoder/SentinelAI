name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[ai,dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Tests
        run: pytest --cov=sentinelai --cov-report=term-missing

      - name: Detection benchmark (regression gate)
        run: sentinel eval --baseline benchmarks/baseline.json

      - name: Sigma pack benchmark (regression gate)
        run: sentinel eval --benchmarks benchmarks/sigma --sigma-rules examples/sigma --baseline benchmarks/sigma/baseline.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sentinelai:ci .

      - name: Smoke test image
        run: |
          docker run --rm sentinelai:ci version
          docker run --rm sentinelai:ci doctor --json || test $? -eq 1
