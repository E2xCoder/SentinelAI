name: Release binaries

# Runs only when a version tag such as v0.1.0 is pushed (or by hand, which
# builds and tests the packages but publishes nothing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: sentinelai-linux-x64.tar.gz
          - os: windows-latest
            asset: sentinelai-windows-x64.zip
          - os: macos-latest
            asset: sentinelai-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .
      - name: Build
        shell: bash
        run: python -m PyInstaller --noconfirm packaging/sentinelai.spec
      - name: Smoke test the packaged programs
        shell: bash
        env:
          # rich treats GitHub Actions as a terminal; on the Windows runner its
          # legacy Win32 console path then fails with OSError 22. TERM=dumb
          # makes it write plain text. Output goes to a file because `grep -q`
          # would close the pipe early and kill the scan (pipefail).
          TERM: dumb
          SENTINELAI_STATE_DIR: ${{ runner.temp }}/state
        run: |
          BIN=dist/SentinelAI
          [ -d dist/SentinelAI.app ] && BIN=dist/SentinelAI.app/Contents/MacOS
          EXT=""
          [ -f "$BIN/sentinel.exe" ] && EXT=".exe"
          "$BIN/sentinel$EXT" --version
          "$BIN/sentinel$EXT" scan examples/auth.log --no-ai > "$RUNNER_TEMP/scan.txt" 2>&1
          grep -q "R00" "$RUNNER_TEMP/scan.txt"
          # The windowed program: serve the interface and scan the sample, no window.
          "$BIN/SentinelAI$EXT" --selftest "$RUNNER_TEMP/selftest.txt" || true
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "SELFTEST OK" "$RUNNER_TEMP/selftest.txt"
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp ../LICENSE ../README.md SentinelAI/
            tar -czf "../${{ matrix.asset }}" SentinelAI
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp ../LICENSE ../README.md SentinelAI/
            7z a -tzip "../${{ matrix.asset }}" SentinelAI
          else
            ditto -c -k --keepParent SentinelAI.app "../${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "SentinelAI ${{ github.ref_name }} (Beta)" \
            --notes "Beta release. Unzip and open SentinelAI (desktop app); the sentinel command-line tool is in the same folder. Builds are unsigned. The app is read-only; automated blocking is a Linux-only CLI feature. Check SHA256SUMS.txt after downloading."
